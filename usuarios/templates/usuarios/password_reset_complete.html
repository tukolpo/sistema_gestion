{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contraseña Actualizada | Sistema de Gestión DSI</title>
  <link rel="stylesheet" href="{% static 'usuarios/css/styles.css' %}">
</head>
<body>
<div class="login-page" style="display:flex; align-items:center; justify-content:center; min-height:100vh;">
  <div style="background:#fff; border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,0.15); padding:40px; max-width:420px; width:100%; text-align:center;">
    <div style="font-size:2.5rem; color:#2b6b3a; margin-bottom:12px;">✓</div>
    <h1 style="font-size:1.3rem; margin:0 0 10px;">Contraseña actualizada</h1>
    <p style="color:var(--color-texto-suave); font-size:0.88rem; margin:0 0 20px;">
      Tu contraseña se cambió correctamente. Ya puedes iniciar sesión.
    </p>
    <a href="{% url 'usuarios:login' %}" class="btn-login" style="display:inline-block; text-decoration:none; padding:10px 24px;">Iniciar sesión</a>
  </div>
</div>
</body>
</html>
